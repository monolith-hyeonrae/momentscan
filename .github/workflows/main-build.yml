# 버전 태그(v*.*.*) push → 빌드·검증 → ECR push(태그명 그대로) →
# -deploy 리포 values-prd.yaml 갱신. develop-build.yml과 같은 흐름의 운영판.
name: main build

on:
  push:
    tags:
      - v*.*.*

jobs:
  build-verify-push:
    runs-on: ubuntu-latest
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Source checkout
        uses: actions/checkout@v4
        with:
          path: momentscan

      - name: Substrate checkout (visualstack)
        uses: actions/checkout@v4
        with:
          repository: monolith-hyeonrae/visualstack
          ssh-key: ${{ secrets.VISUALSTACK_SSH_KEY }}
          path: visualstack

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set environment variable
        run: |
          echo "APPLICATION_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        shell: bash

      - name: Build image (load for verify)
        uses: docker/build-push-action@v6
        with:
          context: momentscan
          file: momentscan/deploy/docker/Dockerfile
          build-contexts: |
            visualstack=visualstack
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha

      - name: Verify in image
        run: |
          IMG=${{ steps.login-ecr.outputs.registry }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}
          docker run --rm --entrypoint momentscan $IMG verify registry
          docker run --rm --entrypoint momentscan $IMG verify api

      - name: Push image to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Checkout helm manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-deploy
          ref: main
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy-repo

      - name: Set new image tag on helm
        run: |
          cd deploy-repo/helm
          sed -i 's/    tag:.*/    tag: "${{ env.IMAGE_TAG }}"/g' values-prd.yaml

      - name: Commit and push helm manifests
        run: |
          cd deploy-repo
          git config --global user.email ${{ github.event.sender.login || 'monolith' }}
          git config --global user.name ${{ github.event.sender.login || 'monolith' }}
          git commit -am "Deploy container image tag ${{ env.IMAGE_TAG }}"
          git push
