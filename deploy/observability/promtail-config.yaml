# promtail — momentscan 구조화 JSON 로그(한 줄=한 이벤트)를 Loki로.
# 회사 이식 시 바꿀 곳: clients.url(+tenant_id/basic_auth) · labels.env(dev→alpha) · host.
server:
  http_listen_port: 0
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: momentscan
    static_configs:
      - targets: [localhost]
        labels:
          service: momentscan
          env: dev                 # 라벨 격리 — 알파/운영과 절대 안 겹치게
          __path__: /var/log/momentscan/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            node: node             # 로그 본문의 노드 정체성("host:port") — 서비스가 도장
      - labels:
          level:                   # 저카디널리티만 라벨 승격 — clip_id는 본문 필드로 유지
          node:                    # 노드 수 = 카디널리티라 안전; 노드별 promtail 설정 불필요
