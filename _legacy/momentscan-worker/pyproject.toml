[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momentscan-worker"
version = "0.0.0"
description = "momentscan worker — processes one video file through the visualstack pipeline and writes parquet output."
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "visualbus",
    "visualpath-core",
    "visualpath-stash",
    "visualbind",
    "visualpath-plugin-face-detect",
    "visualpath-plugin-face-expression",
    "visualpath-plugin-face-landmarks",
    "visualpath-plugin-head-pose",
]

[project.optional-dependencies]
isolation = ["visualpath-isolation"]

[project.scripts]
momentscan-worker = "momentscan_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/momentscan_worker"]
