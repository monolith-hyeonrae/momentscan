[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momentscan-features-specialist45d"
version = "0.0.0"
description = "Track A FeatureSource — specialist ensemble -> 45D structured signal vector per track frame. Isolated venv (onnx / mediapipe / insightface stack; conflicts with Track B's torch)."
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "momentscan",   # FeatureSource Protocol + Tubelet / TrackFeatures types
    "numpy",
    "visualbind",
    "visualpath-plugin-face-detect",
    "visualpath-plugin-face-expression",
    "visualpath-plugin-face-landmarks",
    "visualpath-plugin-head-pose",
]

[tool.hatch.build.targets.wheel]
packages = ["src/momentscan_features_specialist45d"]
