[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momentscan"
version = "0.0.0"
description = "momentscan core — Step 0 (tracks + attribution), Distribution wiring, readings (Profile/Highlight), shared eval harness + telemetry. Track-agnostic; feature extraction is a swappable, isolated FeatureSource."
requires-python = ">=3.11"
license = { text = "TBD" }
# Light, shared deps only. The heavy / conflicting stacks (onnx+mediapipe for
# Track A, torch for Track B) live in the isolated FeatureSource packages under
# plugins/, never here — that is what keeps the venvs from colliding.
dependencies = [
    "boto3>=1.43.57",
    "msgspec>=0.21.1",
    "numpy",
    "polars",
    "visualbus", # bus, FileSource, VideoFileSink, control plane, structured log
    "visualpath-core", # Module/Pipeline runtime (wires FaceDetect onto the bus)
    "visualpath-plugin-face-detect", # buffalo_l detector (Layer 1, warm)
]

[project.optional-dependencies]
# step0b (depth attribution) pulls the torch stack — deliberately NOT a core
# dep (comment above). `uv sync --extra step0b`; `momentscan attribute` runs
# as its own process, so the onnx daemon and the torch stage never share one.
step0b = ["visualpath-plugin-depth"]

[project.scripts]
momentscan = "momentscan.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/momentscan"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff]
# R9 — 검사만 (전면 리포맷 금지: diff 오염 방지). baseline 이후 신규 위반만 차단.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]   # I = isort (내부 임포트 4결 순서 강제, behavior-neutral)
ignore = ["E501"]          # 기존 코드 장문 라인 다수 — line-length는 신규 코드 가이드로만

[tool.ruff.lint.mccabe]
max-complexity = 22        # baseline 관대 시작 — 신규 함수가 이 문턱을 넘으면 §1 추출 신호

[tool.ruff.lint.isort]
# A″ 그룹을 임포트 순서로도 드러낸다 — infra → perception → products → momentscan 나머지.
# 읽는 사람이 임포트 블록만 봐도 의존 방향(시공→관측→제품)을 읽는다.
known-first-party = ["momentscan", "momentscan_features_specialist45d", "momentscan_features_vjepa"]
section-order = ["future", "standard-library", "third-party", "infra", "perception", "products", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
infra = ["momentscan.infra"]
perception = ["momentscan.perception"]
products = ["momentscan.products"]
